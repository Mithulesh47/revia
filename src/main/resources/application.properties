spring.application.name=revia

# PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/revia
spring.datasource.username=revia
spring.datasource.password=revia

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Error handling
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never


# JWT
revia.security.jwt.secret=${REVIA_JWT_SECRET:change-this-development-secret-key-at-least-32-bytes}
revia.security.jwt.expiration-seconds=900
revia.security.jwt.issuer=revia